name: Adventure UI screenshot (emulator)

on:
  push:
    branches: [feat/adventure-roadmap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK for screenshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo '::error::Missing GOOGLE_SERVICES_JSON_B64'; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
      - name: Build debug APK in CI
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK for emulator job
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  screenshot:
    name: Launch APK in a clean emulator runner and capture
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: screenshot-test-apk
          path: artifacts
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Launch emulator, navigate to Adventure, capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci_capture_adventure.sh
      - name: Upload screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adventure-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
