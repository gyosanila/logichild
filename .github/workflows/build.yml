name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "keystore.jks written"
          else
            echo "::warning::KEYSTORE_B64 not set — release will fall back to debug signing"
          fi

      - name: Compile Kotlin (compile check)
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build APK release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Send result to Telegram
        if: always() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not set, skipping notification"
            exit 0
          fi
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ -f "app/build/outputs/apk/release/app-release.apk" ] && [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            printf '✅ Build #%s sukses (debug + release)\nRepo: ${GITHUB_REPOSITORY}\nCommit: %s\n- debug: ad TEST\n- release: ad ASLI (keystore gyosanila)' \
              "${{ github.run_number }}" "$SHA_SHORT" > /tmp/caption.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@app/build/outputs/apk/debug/app-debug.apk" \
                 -F "caption=</tmp/caption.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
            printf '✅ Release signed (gyosanila) — ad ASLI aktif' > /tmp/cap2.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@app/build/outputs/apk/release/app-release.apk" \
                 -F "caption=</tmp/cap2.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
          else
            printf '@randang_bot ❌ Build #%s GAGAL\nRepo: ${GITHUB_REPOSITORY}\nCommit: %s\nCek log: %s' \
              "${{ github.run_number }}" "$SHA_SHORT" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/caption.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "text=</tmp/caption.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
          fi
