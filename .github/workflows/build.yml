name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Kotlin (compile check)
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Send result to Telegram
        if: always() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not set, skipping notification"
            exit 0
          fi
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            printf '✅ Build #%s sukses (debug)\nRepo: gyosanila/KartCilik\nCommit: %s\nAPK Kart Cilik siap install' \
              "${{ github.run_number }}" "$SHA_SHORT" > /tmp/caption.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@${APK_PATH}" \
                 -F "caption=</tmp/caption.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
          else
            printf '@randang_bot ❌ Build #%s GAGAL\nRepo: gyosanila/KartCilik\nCommit: %s\nCek log: %s' \
              "${{ github.run_number }}" "$SHA_SHORT" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/caption.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "text=</tmp/caption.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
          fi
