name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis untuk build manual (mis. 1.0.0)'
        type: string
        required: false
        default: '1.0.0'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "keystore.jks written"
          else
            echo "::warning::KEYSTORE_B64 not set — release will fall back to debug signing"
          fi

      - name: Compile Kotlin (compile check)
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      # ── Versi release: dari tag v*, versionCode = jumlah tag (incremental) ──
      - name: Determine release version
        id: relver
        run: |
          VC=$(git tag -l 'v*' | wc -l)
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            VN="${GITHUB_REF#refs/tags/v}"
          else
            VN="${{ inputs.version }}"
            VC=$((VC + 1))
          fi
          echo "version_name=${VN}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VC}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VN} (code ${VC})"

      # ── Dev: push ke main → debug APK aja ──
      - name: Build APK debug (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: ./gradlew :app:assembleDebug --no-daemon

      # ── Rilis: tag v* atau manual → release APK + AAB ──
      - name: Build release APK + AAB
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PrelVersionName=${{ steps.relver.outputs.version_name }} \
            -PrelVersionCode=${{ steps.relver.outputs.version_code }} --no-daemon

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release APK artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AAB artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload R8 mapping artifact (deobfuscation)
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Send result to Telegram
        if: always() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not set, skipping notification"
            exit 0
          fi
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          REL=${{ steps.relver.outputs.version_name }}
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            printf '📦 Logichild v%s (code %s) — AAB + release APK\nRepo: ${GITHUB_REPOSITORY}\nUpload AAB ke Play Console' \
              "$REL" "${{ steps.relver.outputs.version_code }}" > /tmp/cap.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@app/build/outputs/bundle/release/app-release.aab" \
                 -F "caption=</tmp/cap.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
            printf '✅ Release v%s signed (gyosanila) — ad ASLI' "$REL" > /tmp/cap2.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@app/build/outputs/apk/release/app-release.apk" \
                 -F "caption=</tmp/cap2.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
            if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
              printf '🗺️ mapping.txt v%s — upload ke Play Console (Deobfuscation files)' "$REL" > /tmp/cap4.txt
              curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                   -F "document=@app/build/outputs/mapping/release/mapping.txt" \
                   -F "caption=</tmp/cap4.txt" \
                   "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
            fi
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            printf '✅ Build #%s sukses (debug v1.0.0-debug)\nRepo: ${GITHUB_REPOSITORY}\nCommit: %s' \
              "${{ github.run_number }}" "$SHA_SHORT" > /tmp/caption.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@app/build/outputs/apk/debug/app-debug.apk" \
                 -F "caption=</tmp/caption.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
          else
            printf '@randang_bot ❌ Build #%s GAGAL\nRepo: ${GITHUB_REPOSITORY}\nCommit: %s\nCek log: %s' \
              "${{ github.run_number }}" "$SHA_SHORT" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/caption.txt
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "text=</tmp/caption.txt" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null
          fi
