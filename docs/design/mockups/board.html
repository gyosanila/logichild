<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Logichild — Roadmap UI mockup</title>
<style>
  html,body{margin:0;padding:0;background:#20303f;}
  body{display:flex;justify-content:center}
  #phone{position:relative;width:540px;height:960px;overflow:hidden;background:#8FD4F7;
         font-family:"DejaVu Sans",Verdana,sans-serif;-webkit-font-smoothing:antialiased}
  .hud{position:relative;height:88px;z-index:40;background:linear-gradient(#7fc3ee,#8FD4F7 60%,rgba(143,212,247,0))}
  .hudrow{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box}
  .cbtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #c9dced,0 5px 10px rgba(20,50,80,.18);
        display:flex;align-items:center;justify-content:center}
  .plaque{display:flex;align-items:center;gap:7px;height:46px;padding:0 15px;border-radius:20px;flex:0 0 auto;white-space:nowrap;
          background:linear-gradient(#a9744f,#8B5E3C);box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -5px 0 rgba(0,0,0,.22),0 5px 10px rgba(20,50,80,.22)}
  .plaque b{color:#fff8ec;font-size:15px;letter-spacing:.2px;text-shadow:0 2px 0 rgba(0,0,0,.28)}
  .counters{display:flex;align-items:center;gap:7px}
  .pill{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:18px;background:#fff;
        color:#1E3A5F;box-shadow:0 3px 0 #c9dced,0 5px 9px rgba(20,50,80,.16)}
  .pill b{font-size:17px}
  .ribbon{position:relative;height:12px;margin:0 16px;z-index:40}
  .rtrack{position:absolute;inset:0;border-radius:6px;background:rgba(12,40,66,.28);overflow:hidden}
  .rfill{position:absolute;left:0;top:0;bottom:0;width:29%;background:linear-gradient(90deg,#FFD98A,#FFB347 55%,#FF8C42)}
  .rdots{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 5px}
  .rdot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.5)}
  .rdot.big{width:6px;height:6px;background:rgba(255,255,255,.85)}
  .rflag{position:absolute;top:-9px;left:29%;transform:translateX(-50%)}
  .world{position:absolute;left:0;right:0;top:100px;bottom:0;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:2880px;height:864px}
  .dicebar{position:absolute;left:0;right:0;bottom:0;height:134px;z-index:40;overflow:hidden;background:transparent}
  .diebg{position:absolute;left:0;bottom:0;display:block}
  #diceWrap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:2;display:flex}
  .wsign{position:absolute;bottom:30px;display:flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:16px;
         background:linear-gradient(#a9744f,#8B5E3C);color:#FFF8EC;font-size:13px;font-weight:bold;
         letter-spacing:.3px;white-space:nowrap;
         box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.22),0 5px 10px rgba(10,35,60,.22);z-index:3}
  #hintLeft{left:16px}
  #hintRight{right:16px}
  .hint{display:flex;flex-direction:column;align-items:center;gap:2px;color:#0f3f63;font-size:12px;font-weight:bold;letter-spacing:.6px}
  .chip{height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.92);color:#1E3A5F;
        font-size:13px;font-weight:bold;display:flex;align-items:center;box-shadow:0 3px 0 #c9dced}
  #celebrate{position:absolute;inset:0;z-index:60;display:none}
  .card{position:absolute;left:52px;right:52px;top:462px;background:#fff;border-radius:26px;padding:20px 22px 22px;
        box-shadow:0 14px 30px rgba(10,35,60,.28)}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:16px;color:#1E3A5F;padding:7px 0;font-weight:bold}
  .row i{color:#7b8fa3;font-style:normal;font-weight:bold}
  .btns{display:flex;gap:12px;margin-top:16px}
  .b1,.b2{flex:1;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
  .b1{background:linear-gradient(#7ED957,#4fae2e);color:#fff;box-shadow:0 5px 0 #3d8a22}
  .b2{background:#fff;color:#1E3A5F;border:3px solid #dbe6f0;box-shadow:0 5px 0 #dbe6f0}
</style>
</head>
<body>
<div id="phone">

  <div class="hud">
    <div class="hudrow">
      <div class="cbtn" id="backbtn"></div>
      <div class="plaque"><span id="plaqueico"></span><b id="plaquetext">Peta 1 &middot; Taman Bermain</b></div>
      <div class="counters">
        <div class="pill"><span id="pillstar"></span><b id="starcount">12</b></div>
        <div class="pill"><span id="pillfruit"></span><b>5</b></div>
        <div class="cbtn" id="soundbtn" style="width:38px;height:38px"></div>
      </div>
    </div>
  </div>
  <div class="ribbon">
    <div class="rtrack"><div class="rfill" id="rfill"></div></div>
    <div class="rdots" id="rdots"></div>
    <div class="rflag" id="rflag"></div>
  </div>

  <div class="world">
    <svg id="stage" viewBox="0 0 2880 864" width="2880" height="864"></svg>
  </div>

  <div class="dicebar" id="dicebar">
    <svg class="diebg" id="diebg" viewBox="0 0 540 134" width="540" height="134"></svg>
    <div class="wsign" id="hintLeft"><span id="hlIcon"></span><b id="hlText">KOTAK 4/24</b></div>
    <div class="wsign" id="hintRight"><span id="hrIcon"></span><b id="hrText">LEMPAR DADU</b></div>
    <div id="diceWrap"></div>
  </div>

  <div id="celebrate">
    <svg id="celebrateSvg" viewBox="0 0 540 960" width="540" height="960"></svg>
    <div class="card">
      <div style="text-align:center;font-size:19px;font-weight:bold;color:#1E3A5F;margin-bottom:6px">Peta 1 Selesai!</div>
      <div class="row"><span><span id="cs1"></span> Bintang terkumpul</span><i>42</i></div>
      <div class="row" style="border-top:2px dashed #e6eef6;border-bottom:2px dashed #e6eef6"><span><span id="cs2"></span> Buah terkumpul</span><i>18</i></div>
      <div class="row"><span>Kotak dilewati</span><i>24 / 24</i></div>
      <div class="btns"><div class="b1">Main Lagi</div><div class="b2">Ke Menu</div></div>
    </div>
  </div>
</div>

<script>
/* LOGICHILD ADVENTURE BOARD — MOCKUP BUILDER
   v1 explore/frontier | v2 roll dice + hop | v3 map complete */
var qs = (location.search || '') + (location.hash || '');
var scene = (qs.match(/v=(\d)/) || [0,'1'])[1];
var T   = parseFloat((qs.match(/t=([0-9.]+)/) || [0,'0'])[1]) || 0;
var CAM = /cam=pan/.test(qs);
var DUR = parseFloat((qs.match(/dur=([0-9.]+)/) || [0,'8'])[1]) || 8;
var LOOP = 4;
function wsin(ph2){ return Math.sin((T/LOOP + ph2) * 2*Math.PI); }
function bob(){ return Math.sin(T*Math.PI); }

function star(cx, cy, r, fill, extra){
  var pts=[];
  for(var i=0;i<10;i++){
    var a = -Math.PI/2 + i*Math.PI/5;
    var rr = i%2 ? r*0.44 : r;
    pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" '+(extra||'')+'/>';
}
function apple(cx,cy,s){
  return '<g transform="translate('+cx+','+cy+') scale('+s+')">'+
    '<path d="M0,-2 C-9,-9 -14,-2 -12,4 C-10,10 -3,13 0,11 C3,13 10,10 12,4 C14,-2 9,-9 0,-2 Z" fill="#FF6B6B"/>'+
    '<path d="M1,-6 C3,-11 8,-12 10,-10 C8,-6 4,-5 1,-6 Z" fill="#4fae2e"/>'+
    '<rect x="-1" y="-8" width="2" height="5" rx="1" fill="#6b4423"/></g>';
}
function gift(cx,cy,s){
  return '<g transform="translate('+cx+','+cy+') scale('+s+')">'+
    '<rect x="-11" y="-6" width="22" height="16" rx="3" fill="#A78BFA"/>'+
    '<rect x="-12" y="-11" width="24" height="7" rx="3" fill="#c4b1ff"/>'+
    '<rect x="-2.5" y="-11" width="5" height="21" fill="#FFC94D"/>'+
    '<path d="M0,-11 C-8,-18 -14,-13 -9,-10 C-5,-8 -2,-10 0,-11 Z" fill="#FFC94D"/>'+
    '<path d="M0,-11 C8,-18 14,-13 9,-10 C5,-8 2,-10 0,-11 Z" fill="#FFC94D"/></g>';
}
function lockicon(cx,cy,s,col){
  col = col || '#7d7d7d';
  return '<g transform="translate('+cx+','+cy+') scale('+s+')">'+
    '<path d="M-7,-2 v-4 a7,7 0 0 1 14,0 v4" fill="none" stroke="'+col+'" stroke-width="3.4" stroke-linecap="round"/>'+
    '<rect x="-10" y="-2" width="20" height="15" rx="3.4" fill="'+col+'"/>'+
    '<circle cx="0" cy="5" r="2.2" fill="#fff" opacity=".85"/></g>';
}
function controller(cx,cy,s){
  return '<g transform="translate('+cx+','+cy+') scale('+s+')">'+
    '<rect x="-12" y="-8" width="24" height="16" rx="7" fill="#3f7fd6"/>'+
    '<rect x="-7" y="-2.6" width="7" height="2.6" rx="1.3" fill="#fff"/>'+
    '<rect x="-4.7" y="-4.9" width="2.6" height="7" rx="1.3" fill="#fff"/>'+
    '<circle cx="6" cy="-1.6" r="2.1" fill="#FFC94D"/>'+
    '<circle cx="9.6" cy="1.8" r="2.1" fill="#FF8C8C"/></g>';
}
function rainbow(cx,cy,s){
  var cols=['#FF6B6B','#FFC94D','#7ED957','#4fb0e8','#A78BFA'], o='';
  for(var i=0;i<cols.length;i++){
    var r = 12-i*2;
    o += '<path d="M'+(-r)+',0 a'+r+','+r+' 0 0 1 '+(r*2)+',0" fill="none" stroke="'+cols[i]+'" stroke-width="2.6" '+
         'transform="translate('+cx+','+cy+') scale('+s+')"/>';
  }
  return o;
}
function flagicon(cx,cy,s,col){
  col = col || '#E04747';
  return '<g transform="translate('+cx+','+cy+') scale('+s+')">'+
    '<rect x="-1.2" y="-20" width="2.4" height="22" rx="1.2" fill="#8B5E3C"/>'+
    '<path d="M1.4,-19 L15,-14.5 L1.4,-10 Z" fill="'+col+'"/></g>';
}
function trophy(cx,cy,s,gold){
  var g1 = gold?'#FFD24D':'#d7d7d7', g2 = gold?'#E0A22B':'#b4b4b4';
  return '<g transform="translate('+cx+','+cy+') scale('+s+')">'+
    '<path d="M-13,-22 h26 v9 a13,13 0 0 1 -26,0 Z" fill="'+g1+'"/>'+
    '<path d="M-13,-20 c-8,0 -9,12 1,13 M13,-20 c8,0 9,12 -1,13" fill="none" stroke="'+g2+'" stroke-width="3.4" stroke-linecap="round"/>'+
    '<rect x="-3" y="-9" width="6" height="9" fill="'+g2+'"/>'+
    '<path d="M-11,-1 h22 l3,7 h-28 Z" fill="'+g1+'"/>'+
    '<path d="M-16,6 h32 v6 h-32 Z" fill="'+g2+'"/>'+
    '<path d="M-9,-19 h6 v13 h-6 Z" fill="#fff" opacity=".38"/></g>';
}

var TYPE = ['start','plain','star','minigame','plain','bonus','collect','minigame','star','plain',
            'gift','minigame','plain','collect','star','plain','minigame','bonus','star','collect',
            'minigame','gift','star','finish'];
var YARR = [553,615,583,489,428,461,553,615,583,489,428,461,553,615,583,489,428,461,553,615,583,489,428,461];
function X(i){ return 80 + i*118; }
function Y(i){ return YARR[i]; }
var ZP = Math.min(4, Math.max(1, parseInt((qs.match(/z=(\d)/) || [0,'1'])[1], 10) || 1));
var CUR = (ZP-1)*6 + 3, DONE = CUR-1;
var RATING = {0:5, 1:4, 2:3};
var ZONES = [
  {n:'Semi',  x0:0,    x1:729,  g1:'#A6DE78', g2:'#82CD58', patch:'#63B247', tint:'#FFD6EB', to:.16, sky:'#BFE9FF', tree:'blossom'},
  {n:'Panas', x0:729,  x1:1437, g1:'#8FD24F', g2:'#63B537', patch:'#4FA62E', tint:'#FFF3BE', to:.18, sky:'#B6E6FF', tree:'summer'},
  {n:'Gugur', x0:1437, x1:2145, g1:'#C6CB5E', g2:'#A0A845', patch:'#8C9238', tint:'#FFDFA8', to:.20, sky:'#CFE6F5', tree:'autumn'},
  {n:'Dingin',x0:2145, x1:2880, g1:'#EEF6FB', g2:'#D2E5F2', patch:'#BCD4E6', tint:'#E2F0FF', to:.30, sky:'#DCEBF7', tree:'winter'}
];
function frost(x){
  var t0 = 1820, t1 = 2240;
  return Math.max(0, Math.min(1, (x-t0)/(t1-t0)));
}
var WALK = /walk=1/.test(qs);
var WALKCAMX = 0;
var WN = 7, WHOP = 1.05, WSTEP = 0;
function zoneAt(x){ for(var i=0;i<ZONES.length;i++) if(x>=ZONES[i].x0 && x<ZONES[i].x1) return ZONES[i]; return ZONES[3]; }

function pathThrough(pts, k){
  k = k || 1;
  var d = 'M '+pts[0][0]+' '+pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || pts[i+1];
    var c1x = p1[0] + (p2[0]-p0[0])/6*k, c1y = p1[1] + (p2[1]-p0[1])/6*k;
    var c2x = p2[0] - (p3[0]-p1[0])/6*k, c2y = p2[1] - (p3[1]-p1[1])/6*k;
    d += ' C '+c1x.toFixed(1)+' '+c1y.toFixed(1)+', '+c2x.toFixed(1)+' '+c2y.toFixed(1)+', '+p2[0]+' '+p2[1];
  }
  return d;
}
var ANCH = [];
for(var ai=0; ai<YARR.length; ai++) ANCH.push([X(ai), YARR[ai]]);
if(WALK){
  WSTEP = Math.min(WN, T/WHOP);
  DONE  = Math.min(WN-1, Math.floor(WSTEP));
  CUR   = DONE + 1;
}
function walkState(){
  var i0 = Math.min(WN-1, Math.floor(WSTEP)), f = WSTEP - i0;
  if(WSTEP >= WN){ i0 = WN-1; f = 1; }
  var a0 = ANCH[i0], a1 = ANCH[i0+1] || a0;
  return {a0:a0, a1:a1, f:Math.max(0, Math.min(1, f)), i0:i0};
}

function prand(n){ var s = Math.sin(n*127.13)*43758.5453; return s - Math.floor(s); }

var S = [];
S.push('<defs>'+
  '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#8FD4F7"/><stop offset=".72" stop-color="#BFE9FF"/><stop offset="1" stop-color="#E7F8FF"/></linearGradient>'+
  '<linearGradient id="groundX" x1="0" y1="0" x2="1" y2="0">'+
    '<stop offset="0" stop-color="#A6DE78"/><stop offset=".22" stop-color="#8ACD5E"/>'+
    '<stop offset=".28" stop-color="#8FD24F"/><stop offset=".46" stop-color="#63B537"/>'+
    '<stop offset=".52" stop-color="#D3D06A"/><stop offset=".62" stop-color="#C3C259"/>'+
    '<stop offset=".72" stop-color="#CFD79C"/><stop offset=".80" stop-color="#E4EDD6"/>'+
    '<stop offset=".88" stop-color="#F2F9FD"/><stop offset="1" stop-color="#DCEBF5"/></linearGradient>'+
  '<linearGradient id="groundShade" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#FFFFFF" stop-opacity=".3"/><stop offset=".22" stop-color="#FFFFFF" stop-opacity="0"/>'+
    '<stop offset=".6" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".1"/></linearGradient>'+
  '<linearGradient id="wsky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E2F0FF" stop-opacity="0"/>'+
    '<stop offset=".45" stop-color="#E2F0FF" stop-opacity=".38"/><stop offset="1" stop-color="#E2F0FF" stop-opacity=".38"/></linearGradient>'+
  '<linearGradient id="wsnowG" x1="1820" y1="0" x2="2260" y2="0" gradientUnits="userSpaceOnUse">'+
    '<stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>'+
  '<mask id="wsnow"><rect x="1800" y="240" width="1080" height="500" fill="url(#wsnowG)"/></mask>'+
  '<radialGradient id="sunglow" cx=".5" cy=".5" r=".5">'+
    '<stop offset="0" stop-color="#FFF3B0" stop-opacity=".95"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient>'+
  '<radialGradient id="glow" cx=".5" cy=".5" r=".5">'+
    '<stop offset="0" stop-color="#FFF0B0" stop-opacity=".85"/><stop offset="1" stop-color="#FFD24D" stop-opacity="0"/></radialGradient>'+
  '<filter id="soft3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>'+
  '</defs>');

S.push('<g id="layerSky">');
S.push('<rect x="0" y="0" width="2880" height="260" fill="url(#sky)"/>');
S.push('<rect x="1900" y="0" width="980" height="260" fill="url(#wsky)"/>');
S.push('</g>');
S.push('<g id="layerClouds">');
S.push('<circle cx="470" cy="96" r="120" fill="url(#sunglow)"/><circle cx="470" cy="96" r="42" fill="#FFE98A"/>'+
       '<circle cx="470" cy="96" r="42" fill="none" stroke="#FFF6C9" stroke-width="5" opacity=".7"/>');
function cloud(cx,cy,s,op,face){
  return '<g transform="translate('+(cx+wsin(cx/420)*11)+','+(cy+bob()*3)+') scale('+s+')" opacity="'+op+'">'+
    '<ellipse cx="0" cy="0" rx="46" ry="24" fill="#fff"/><ellipse cx="-34" cy="8" rx="30" ry="17" fill="#fff"/>'+
    '<ellipse cx="32" cy="9" rx="34" ry="19" fill="#fff"/><ellipse cx="6" cy="-14" rx="28" ry="19" fill="#fff"/>'+
    '<ellipse cx="0" cy="10" rx="46" ry="14" fill="#eaf6ff"/>'+
    (face? '<circle cx="-13" cy="-5" r="4.8" fill="#3a2415"/><circle cx="13" cy="-5" r="4.8" fill="#3a2415"/>'+
      '<circle cx="-11.4" cy="-6.6" r="1.8" fill="#fff"/><circle cx="14.6" cy="-6.6" r="1.8" fill="#fff"/>'+
      '<path d="M-9,3 q9,10 18,0" stroke="#3a2415" stroke-width="2.8" fill="none" stroke-linecap="round"/>'+
      '<ellipse cx="-26" cy="3" rx="5.6" ry="3.7" fill="#FF9C9C" opacity=".7"/>'+
      '<ellipse cx="26" cy="3" rx="5.6" ry="3.7" fill="#FF9C9C" opacity=".7"/>' : '') + '</g>';
}
[[190,112,1.05,.97,1],[742,74,.8,.92,0],[1180,138,1.12,.95,1],[1742,88,.72,.88,0],[2300,122,.96,.92,0],[2680,68,.82,.9,0]]
  .forEach(function(c){ S.push(cloud(c[0],c[1],c[2],c[3],c[4])); });

function balloon(x,y,s,col,ph2){
  var sw = wsin(ph2)*9;
  var str = 'M0,0 C '+(sw*0.4).toFixed(1)+',-9 '+(sw*0.8).toFixed(1)+',-18 0,-27';
  return '<g transform="translate('+x+','+(y+bob()*4).toFixed(1)+') rotate('+sw.toFixed(2)+') scale('+s+')">'+
    '<path d="'+str+'" fill="none" stroke="#8B5E3C" stroke-width="1.8" stroke-linecap="round"/>'+
    '<g transform="translate(0,-27)">'+
      '<path d="M0,0 C-17,-4 -21,-27 0,-31 C21,-27 17,-4 0,0 Z" fill="'+col+'"/>'+
      '<ellipse cx="-6" cy="-21" rx="4" ry="6.5" fill="#fff" opacity=".32"/>'+
      '<path d="M-5,-1.5 h10" stroke="#8B5E3C" stroke-width="1.8"/></g></g>';
}
[[148,172,1.0,'#FF6B6B',0.02],[238,128,.8,'#FFC94D',0.36],[474,144,.95,'#A78BFA',0.68]].forEach(function(b2){
  S.push(balloon(b2[0],b2[1],b2[2],b2[3],b2[4]));
});
[[366,86,2.6],[300,56,2.2],[540,66,2.2]].forEach(function(bd,i2){
  S.push('<path d="M'+(bd[0]+wsin(i2*0.31)*12).toFixed(0)+','+(bd[1]+bob()*2).toFixed(0)+' q9,-8 18,0 q9,-8 18,0" fill="none" stroke="#5b7b96" stroke-width="'+bd[2]+'" stroke-linecap="round"/>');
});
(function(){
  var cols=['#FF6B6B','#FFB347','#FFE066','#7ED957','#4fb0e8','#A78BFA'];
  var g='<g opacity=".3" transform="translate(330,258)">';
  for(var i=0;i<cols.length;i++){
    var r = 112-i*11;
    g += '<path d="M0,0 a'+r+','+r+' 0 0 1 '+(r*2)+',0" fill="none" stroke="'+cols[i]+'" stroke-width="10"/>';
  }
  S.push(g+'</g>');
})();

S.push('<g opacity=".9">'+
  '<path d="M0,258 C 180,164 330,196 470,248 C 560,280 620,288 700,288 L0,288 Z" fill="#6FB7A0"/>'+
  '<path d="M1050,288 C 1150,196 1290,182 1400,236 C 1490,278 1600,288 1700,288 Z" fill="#6FB7A0"/>'+

function blobPath(rx, ry){
  var a=[];
  for(var i=0;i<8;i++){
    var ang = i*Math.PI/4, rr = 1 + (prand(i*3.1)-0.5)*0.14;
    a.push([Math.cos(ang)*rx*rr, Math.sin(ang)*ry*rr]);
  }
  var d = 'M '+a[0][0].toFixed(1)+','+a[0][1].toFixed(1);
  for(var j=1;j<=a.length;j++){
    var p = a[j%a.length], pr = a[(j-1)%a.length];
    var mx = (pr[0]+p[0])/2 + (pr[1]-p[1])*0.16, my = (pr[1]+p[1])/2 + (p[0]-pr[0])*0.16;
    d += ' Q '+pr[0].toFixed(1)+','+pr[1].toFixed(1)+' '+mx.toFixed(1)+','+my.toFixed(1);
  }
  return d + ' Z';
}
